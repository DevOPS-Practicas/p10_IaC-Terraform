version: 0.0
os: linux

files:
  - source: /
    destination: /opt/mi-app
    overwrite: true

permissions:
  - object: /opt/mi-app/scripts
    pattern: "*.sh"
    mode: 755
    type:
      - file

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/start_app.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 360
      runas: root
