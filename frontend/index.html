<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora - Práctica 10</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 4rem auto; padding: 0 1rem; }
    input, select, button { font-size: 1rem; padding: .55rem; margin: .25rem 0; width: 100%; box-sizing: border-box; }
    #result { margin-top: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Calculadora</h1>
  <input id="a" type="number" step="any" placeholder="Primer número">
  <input id="b" type="number" step="any" placeholder="Segundo número">
  <select id="op">
    <option value="add">Sumar</option>
    <option value="sub">Restar</option>
    <option value="mul">Multiplicar</option>
    <option value="div">Dividir</option>
  </select>
  <button onclick="calculate()">Calcular</button>
  <div id="result"></div>

  <script>
    async function calculate() {
      const payload = {
        a: Number(document.getElementById('a').value),
        b: Number(document.getElementById('b').value),
        op: document.getElementById('op').value
      };
      const response = await fetch('/api/calculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      document.getElementById('result').textContent =
        response.ok ? `Resultado: ${data.result}` : `Error: ${data.detail}`;
    }
  </script>
</body>
</html>
